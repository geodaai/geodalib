name: Build, Test and Publish

on:
  push:
    branches: [main]
    tags:
      - '*'
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Volta
        uses: volta-cli/action@v1
        with:
          node-version: '24'
          yarn-version: '4.0.0'

      - name: Install Dependencies
        working-directory: js
        run: yarn install

      - name: Build
        working-directory: js
        run: yarn build

      - name: Lint
        working-directory: js
        run: yarn lint

      - name: Test
        working-directory: js
        run: yarn test

      - name: Publish to NPM
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: js
        run: |
          npm publish packages/core
          npm publish packages/lisa
          npm publish packages/regression
